<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长按识别二维码</title>
<!-- 引入jsQR二维码解析库 -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
.qr-img{
  width:240px;
  cursor:pointer;
}
</style>
</head>
<body>

<!-- 你的二维码图片 -->
<img id="qrImage" class="qr-img" src="wechat-pay.jpg" alt="二维码">

<script>
const imgEl = document.getElementById('qrImage');

// 长按定时器
let longPressTimer = null;
const LONG_PRESS_TIME = 500; // 长按500ms触发

imgEl.addEventListener('touchstart', function(e) {
  longPressTimer = setTimeout(()=>{
    scanQR(this);
  }, LONG_PRESS_TIME);
});
imgEl.addEventListener('touchend', ()=>{
  clearTimeout(longPressTimer);
});
imgEl.addEventListener('touchcancel', ()=>{
  clearTimeout(longPressTimer);
});

// 二维码解析函数
async function scanQR(img) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  ctx.drawImage(img,0,0);
  const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
  const code = jsQR(imageData.data, canvas.width, canvas.height);

  if(code){
    const result = code.data;
    if(confirm(`识别到二维码：\n${result}\n是否打开链接？`)){
      window.location.href = result;
    }
  }else{
    alert("未识别到二维码");
  }
}
</script>

<!-- 51LA统计代码放这里 -->
</body>
</html>
